[project]
name = "tasktracker"
version = "0.1.0"
description = "Simple CLI task tracker"
requires-python = ">=3.10"

[project.scripts]
tasktracker = "tasktracker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tasktracker"]
